name: Rust Quality Autofix

on:
  push:
    branches:
      - quality/strict-rust-baseline

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Apply machine-applicable Clippy fixes
        run: cargo clippy --fix --allow-dirty --allow-staged --locked --all-targets --all-features -- -D warnings
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit generated source cleanup
        shell: bash
        run: |
          if git diff --quiet -- src; then
            echo "No source cleanup required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Fix Rust lint and formatting baseline"
          git push
